
jobs:
  build-and-push:
    name: Build, Test and Push Docker Image
    runs-on: ubuntu-latest

    # Start PostgreSQL for integration tests
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: shop
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d shop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Spring Boot database configuration for CI
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/shop
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: postgres

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and Test
        run: ./mvnw -B clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-springboot-demo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-springboot-demo:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
