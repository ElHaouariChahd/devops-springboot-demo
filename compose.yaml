services:

  backend:
    build: .
    container_name: shop-backend

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://database:5432/shop
      DB_USERNAME: admin
      DB_PASSWORD: admin123

    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17
    container_name: shop-database

    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d shop"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: